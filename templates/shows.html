<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIF Shows</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='shows.css') }}">
</head>
<body>
  <a href="/" class="back-link">← Back to message editor</a>
  <h1>GIF Shows</h1>
  <p class="intro">
    A show has one lane per display. Each lane plays its steps in order and then
    loops; all lanes start together, so use waits to stagger a GIF from one
    display to the next.
  </p>

  <section class="panel">
    <h2>GIF library</h2>
    <form id="upload-form" class="row">
      <input id="upload-file" type="file" accept="image/gif" multiple>
      <button type="submit">Add GIFs</button>
      <span id="upload-result" class="muted"></span>
    </form>
    <div id="library" class="library"></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <select id="show-select" aria-label="Show"></select>
      <input id="show-name" type="text" maxlength="80" placeholder="Show name" aria-label="Show name">
      <button id="save-btn" type="button">Save</button>
      <button id="play-btn" type="button">Play</button>
      <button id="stop-btn" type="button" class="secondary">Stop</button>
      <button id="delete-btn" type="button" class="danger">Delete</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <div id="lanes"></div>
    <button id="add-lane-btn" type="button" class="secondary">+ Add display lane</button>
    <p id="cycle" class="muted"></p>
  </section>

  <script src="{{ url_for('static', filename='shows.js') }}"></script>
</body>
</html>
