<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Message</title>
  <style>
  :root {
    color-scheme: dark;
    font: 16px system-ui, sans-serif;
    background: #111318;
    color: #e8eaf0;
  }

  body {
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .device-selector {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  select {
    padding: 0.5rem;
    border: 1px solid #454957;
    border-radius: 6px;
    background: #1b1e26;
    color: #e8eaf0;
    font: inherit;
  }

  .devices-link {
    color: #7c9cff;
    text-decoration: none;
  }

  .devices-link:hover {
    text-decoration: underline;
  }

  textarea {
    box-sizing: border-box;
    width: 100%;
    min-height: 8rem;
    margin-top: 0.5rem;
    padding: 0.7rem;
    border: 1px solid #454957;
    border-radius: 8px;
    background: #1b1e26;
    color: #e8eaf0;
    font: inherit;
  }

  button {
    margin-top: 0.7rem;
    padding: 0.6rem 1rem;
    border: 0;
    border-radius: 8px;
    background: #7c9cff;
    color: #111318;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #9ab1ff;
  }

  #status {
    margin: 1rem 0;
    color: #b7c5ff;
  }

  #result {
    color: #aab0bf;
  }

  #gif-result {
    color: #aab0bf;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>ESP32 Message</h1>
    <div class="device-selector">
      <select id="device-select">
        <option value="default">Default</option>
      </select>
      <a href="/devices" class="devices-link">Manage Devices</a>
    </div>
  </div>
  <p id="status">Checking ESP32…</p>
  <form id="form">
    <label for="text">Display message</label>
    <textarea id="text" maxlength="300"></textarea>
    <button type="submit">Publish message</button>
  </form>
<form id="gif-form">
  <label for="gif-file">Upload a GIF for the OLED</label>
  <input id="gif-file" type="file" accept="image/gif">
  <button type="submit">Upload GIF</button>
</form>
<p id="gif-result"></p>
  <p id="result"></p>

  <script>
    const statusEl = document.querySelector("#status");
    const textEl = document.querySelector("#text");
    const resultEl = document.querySelector("#result");
    const deviceSelect = document.querySelector("#device-select");

    let currentDevice = "default";

    // Get device from URL param
    const urlParams = new URLSearchParams(window.location.search);
    const deviceParam = urlParams.get("device");
    if (deviceParam) {
      currentDevice = deviceParam;
    }

    async function loadDevices() {
      try {
        const response = await fetch("/api/devices");
        const data = await response.json();
        deviceSelect.innerHTML = '<option value="default">Default</option>' +
          data.devices.map(d => `<option value="${escapeHtml(d.name)}" ${d.name === currentDevice ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('');
      } catch (error) {
        console.error("Failed to load devices:", error);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    deviceSelect.addEventListener("change", () => {
      currentDevice = deviceSelect.value;
      const url = new URL(window.location);
      if (currentDevice === "default") {
        url.searchParams.delete("device");
      } else {
        url.searchParams.set("device", currentDevice);
      }
      window.history.replaceState({}, "", url);
      refreshStatus();
    });

    async function refreshStatus() {
      try {
        const response = await fetch(`/api/status?device=${encodeURIComponent(currentDevice)}`);
        const status = await response.json();
        statusEl.textContent = status.device_seen
          ? "ESP32: recently connected"
          : "ESP32: not seen yet";
        if (document.activeElement !== textEl) {
          textEl.value = status.message.text;
        }
      } catch {
        statusEl.textContent = "Cannot reach the server";
      }
    }

    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const response = await fetch(`/api/message?device=${encodeURIComponent(currentDevice)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: textEl.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        resultEl.textContent = "Published.";
        await refreshStatus();
      } catch (error) {
        resultEl.textContent = "Could not publish: " + error.message;
      }
    });

const gifResult = document.querySelector("#gif-result");

document.querySelector("#gif-form").addEventListener("submit", async (event) => {
  event.preventDefault();

  const file = document.querySelector("#gif-file").files[0];
  if (!file) {
    gifResult.textContent = "Choose a GIF first.";
    return;
  }

  const formData = new FormData();
  formData.append("gif", file);

  try {
    gifResult.textContent = "Uploading…";
    const response = await fetch(`/api/animation?device=${encodeURIComponent(currentDevice)}`, {
      method: "POST",
      body: formData
    });
    const data = await response.json();
    if (!response.ok)
        throw new Error(data.error || "Upload failed");

    gifResult.textContent = `Uploaded ${data.frame_count} frames.`;
  } catch (error) {
    gifResult.textContent = "Could not upload: " + error.message;
  }
});

    loadDevices();
    refreshStatus();
    setInterval(refreshStatus, 2000);
    setInterval(loadDevices, 10000);
  </script>
</body>
</html>
